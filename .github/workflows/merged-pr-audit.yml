name: Merged PR audit
on:
  push:
    branches: [research/merged-pr-review-20260920]
    paths: [.github/workflows/merged-pr-audit.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect public review evidence and exact source history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-audit"
          git fetch https://github.com/realiti4/claude-swap.git main:refs/remotes/upstream/main
          git bundle create "$RUNNER_TEMP/pr-audit/repository.bundle" --all
          python - <<'PY'
          import concurrent.futures, datetime, json, os, pathlib, time, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr-audit'
          base = 'https://api.github.com/repos/realiti4/claude-swap'
          headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'X-GitHub-Api-Version': '2022-11-28'}
          def get(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=40) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                      time.sleep(2 ** attempt)
          def pages(url, key=None):
              values = []
              for page in range(1, 51):
                  result = get(url + ('&' if '?' in url else '?') + f'per_page=100&page={page}')
                  batch = result[key] if key else result
                  values.extend(batch)
                  if len(batch) < 100:
                      return values
              raise RuntimeError('Pagination cap reached: ' + url)
          pulls = pages(base + '/pulls?state=all&sort=created&direction=asc')
          (root / 'pulls.json').write_text(json.dumps(pulls), encoding='utf-8')
          merged = [p for p in pulls if p['merged_at']]
          errors = []
          def collect(pr):
              number = pr['number']
              out = {'number': number, 'retrieved_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
              endpoints = {
                  'detail': f'/pulls/{number}',
                  'files': f'/pulls/{number}/files',
                  'comments': f'/issues/{number}/comments',
                  'reviews': f'/pulls/{number}/reviews',
                  'inline_comments': f'/pulls/{number}/comments',
                  'head_checks': f'/commits/{pr["head"]["sha"]}/check-runs',
                  'head_status': f'/commits/{pr["head"]["sha"]}/status',
              }
              for kind, path in endpoints.items():
                  try:
                      if kind in ('files', 'comments', 'reviews', 'inline_comments'):
                          out[kind] = pages(base + path)
                      elif kind == 'head_checks':
                          out[kind] = pages(base + path, 'check_runs')
                      else:
                          out[kind] = get(base + path)
                  except Exception as exc:
                      out[kind] = {'retrieval_error': str(exc)}
                      errors.append({'pr': number, 'kind': kind, 'error': str(exc)})
              (root / f'pr-{number}.json').write_text(json.dumps(out), encoding='utf-8')
              detail = out.get('detail', {})
              tests = [f['filename'] for f in out.get('files', []) if isinstance(f, dict) and f.get('filename', '').startswith('tests/')]
              print(json.dumps({'pr': number, 'additions': detail.get('additions'), 'deletions': detail.get('deletions'), 'files': detail.get('changed_files'), 'test_files': len(tests)}), flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(collect, merged))
          summary = {'all_prs': len(pulls), 'merged_prs': len(merged), 'open_prs': sum(p['state']=='open' for p in pulls), 'retrieval_errors': errors, 'note': 'Check runs are the records currently retained for the final PR head, not proof of the exact status at merge. Missing patch fields are not full diffs.'}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merged-pr-audit
          path: ${{ runner.temp }}/pr-audit
          retention-days: 14
