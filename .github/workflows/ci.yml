name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # uv (not pip) so the PEP 735 dev dependency-group — pytest,
      # pytest-asyncio — installs from the committed lockfile, same as local
      # development.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        # Includes the TUI tests: the Textual TUI (unlike the old curses one)
        # runs on stock Windows, and this job is the proof.
        run: uv run pytest

  # The id stays `macos-keychain` although the job now runs everything: it is
  # the name branch protection matches on, and renaming it silently drops the
  # required check.
  macos-keychain:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the whole suite (not only the Keychain files)
        # THE NARROW SELECTION WAS A BLIND SPOT, not a saving. Three cases
        # failed on macOS -- one asserting the Linux XDG layout, two because a
        # usable Keychain takes the write and leaves no `.enc` to chmod --
        # while every job stayed green, because this job never ran them. A merge that
        # restores a two-file selection here re-opens that hole invisibly:
        # those cases pass now, they would simply stop running.
        #
        # faulthandler dumps every thread's stack past the budget, the only
        # clue when a `security` call blocks on an invisible SecurityAgent
        # dialog. While pyproject sets no faulthandler keys this `-o` is the
        # only thing setting the budget and the dump does not abort; PR 287
        # adds them repo-wide at the same 600, after which this is a no-op
        # and the dump aborts the worker. `timeout-minutes` is the backstop
        # that holds under either ordering.
        timeout-minutes: 15
        run: uv run pytest -o faulthandler_timeout=600


  windows-task-scheduler:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked
      - name: Install the wheel into a path containing spaces
        shell: pwsh
        run: |
          uv build --wheel --out-dir "$env:RUNNER_TEMP/cswap-wheel"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv venv "$env:RUNNER_TEMP/cswap path with spaces"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem "$env:RUNNER_TEMP/cswap-wheel/*.whl" | Select-Object -First 1
          uv pip install --python "$env:RUNNER_TEMP/cswap path with spaces/Scripts/python.exe" $wheel.FullName
          exit $LASTEXITCODE
      - name: Exercise native lifecycle and recovery serially
        shell: pwsh
        run: |
          uv run python tests/windows_task_scheduler_check.py --folder "$env:RUNNER_TEMP/cswap-native-$env:GITHUB_RUN_ID" --python "$env:RUNNER_TEMP/cswap path with spaces/Scripts/python.exe" --recovery
          exit $LASTEXITCODE
      - name: Verify cleanup even after a failed check
        if: always()
        shell: pwsh
        run: |
          $folder = "$env:RUNNER_TEMP/cswap-native-$env:GITHUB_RUN_ID"
          if (Test-Path "$folder/receipt.json") {
            & .venv/Scripts/python.exe tests/windows_task_scheduler_check.py --folder $folder --cleanup
            exit $LASTEXITCODE
          }
