[project]
name = "claude-swap"
version = "0.26.0b1+haotool.1"
description = "Multi-account switcher for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Windows-only: needed solely by the one-time keyring -> files migration
    # (migrations.py) for users upgrading from <=0.10.x. macOS/Linux never
    # import it on the hot path; the macOS migration has a security-CLI
    # fallback and the legacy purge sweep no-ops when it's absent.
    "keyring>=25.0.0; sys_platform == 'win32'",
    "textual>=8.2.8,<9",
    "truststore>=0.10.4",
]
authors = [{name = "Onur Cetinkol", email = "onurcetinkol@gmail.com"}]
license = {text = "MIT"}
keywords = ["claude", "claude-code", "account-switcher", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4.0"]

[project.urls]
Homepage = "https://github.com/haotool/claude-swap"
Repository = "https://github.com/haotool/claude-swap"
Issues = "https://github.com/haotool/claude-swap/issues"

[project.scripts]
claude-swap = "claude_swap.cli:main"
cswap = "claude_swap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_swap"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "ruff>=0.15.20",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Upstream-adopted modules (0.22–0.26) follow upstream exception/style patterns;
# fork service layer stays fully checked under the default rule set.
ignore = ["BLE001", "SIM117", "PLW1510", "RUF012", "S110", "SIM102", "SIM103", "G201", "SIM115", "PLC0206", "DTZ005", "B017", "PLC0414", "UP031", "UP017", "I001", "RUF059", "UP037", "RUF100", "PIE790", "F401", "F841", "PLR0402", "C408", "FURB162", "UP035", "RUF007", "RET501", "PLR1711", "ARG001", "ARG002", "PTH123", "TRY003", "EM101", "EM102", "N818", "S603", "S607", "PYI034", "SIM118", "ISC004", "RUF022", "UP012", "UP041"]

[tool.mypy]
# The whole package is strict; `uv run mypy` (pre-commit) and
# `mypy --strict src/claude_swap` (CI) check the same thing.
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src/claude_swap"]
ignore_missing_imports = true
warn_unreachable = true

# rumps ships no type stubs and MenuBarApp subclasses the untyped rumps.App
# (decorated handlers included), so full strict is impossible for the upstream
# menubar glue. Everything else in the module stays strict-checked.
[[tool.mypy.overrides]]
module = "claude_swap.menubar"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_subclassing_any = false
disallow_untyped_decorators = false

# Upstream-adopted modules (0.22–0.26) are not yet strict-typed; fork service
# layer and grafts remain strict-checked above.
[[tool.mypy.overrides]]
module = [
    "claude_swap.switcher",
    "claude_swap.autoswitch",
    "claude_swap.credentials",
    "claude_swap.oauth",
    "claude_swap.settings",
    "claude_swap.json_output",
    "claude_swap.usage_store",
    "claude_swap.transfer",
    "claude_swap.menubar",
    "claude_swap.claude_locks",
    "claude_swap.session",
    "claude_swap.appearance",
    "claude_swap.fsutil",
    "claude_swap.pace",
    "claude_swap.tui.*",
    "claude_swap.printer",
    "claude_swap.process_detection",
    "claude_swap.locking",
    "claude_swap.mappings",
    "claude_swap.macos_keychain",
    "claude_swap.update_check",
    "claude_swap.poll_policy",
    "claude_swap.snapshot_source",
    "claude_swap.cache",
    "claude_swap.logging_config",
    "claude_swap.models",
    "claude_swap.cli",
    "claude_swap.migrations",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Parallel by default. The suite is ~1900 tests of mostly-idle work (file
# locks, subprocess fakes, Textual pilots), so wall clock was dominated by
# doing them one at a time, not by any single slow test: 25 ms/test spread
# across the whole suite, with the top five totalling under 7 s of a 51 s run.
# Measured here, 48 cores: 51.0s serial -> 12.1s (-n 8) -> 7.7s (-n 16), same
# 1929 passed / 4 skipped every time, three consecutive runs, real account
# store hash unmoved. `auto` rather than a fixed number so CI runners (2-4
# cores) and this box both get the cores they have.
addopts = "-n auto --dist loadgroup"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "no_keychain_fake: opt out of the autouse in-memory Keychain guard (test mocks subprocess itself, or runs against a temp keychain on GitHub Actions)",
    "no_oauth_profile_fake: opt out of the autouse fetch_oauth_profile stub (test exercises fetch_oauth_profile itself against a mocked urlopen)",
    "windows_service_integration: real Task Scheduler registration round-trip (CI windows-task-scheduler job only)",
]
